services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  clickhouse-server:
    image: clickhouse/clickhouse-server:24.5
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 15s
      timeout: 30s
      retries: 6
      start_period: 90s    # give ClickHouse extra time to start
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped

  producer:
    build: ./producer
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse-server:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: wikimedia.recentchange
    command: >   # limit JVM heap to avoid OOM inside the Docker VM
      java -Xmx512m -Xms256m -jar /app/producer.jar
    restart: unless-stopped

  streams-app:
    build: ./streams-app
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse-server:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: wikimedia.recentchange
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse-server:8123/default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    command: >
      java -Xmx1024m -Xms512m -jar /app/streams-app.jar
    restart: unless-stopped

volumes:
  clickhouse-data:


